[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sng-consulter"
version = "0.1.0"
description = "Steel & Glass document understanding and extraction service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "pymupdf>=1.24,<2.0",
  "pillow>=10.4,<13.0",
  "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sng_consulter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
